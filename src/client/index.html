<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arena POC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header><b>Arena</b> <small>POC · ชื่อชั่วคราว</small></header>
    <div id="stage"></div>
    <main id="panel"><p class="muted">กำลังโหลด…</p></main>
    <script type="module" src="./main.ts"></script>
    <script>
      // If the game code fails to load (bad module, network), say so instead of "loading" forever.
      setTimeout(function () {
        var p = document.getElementById('panel');
        if (p && p.textContent.indexOf('กำลังโหลด') !== -1 && !document.querySelector('canvas')) {
          p.innerHTML = '<p style="color:#ff6b6b">โหลดเกมไม่สำเร็จ ลองรีเฟรช หรือเปิด DevTools (F12) ดู Console</p>';
        }
      }, 10000);
    </script>
  </body>
</html>
